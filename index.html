<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://ugm.ac.id/id/fakultas/sekolah-vokasi/" target="_blank"
                            rel="noopener noreferrer">
                            <i class="bi bi-link-45deg"></i> SV UGM
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal">
                            <i class="bi bi-info-circle"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th style="width: 25%;">Nama</th>
                            <td>Lityastami L.</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/569002/SV/27581</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>A</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel">Informasi Wilayah</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3022073, 123.1663513], 11);

        // Map Panes
        map.createPane('jumlah_penduduk');
        map.getPane('jumlah_penduduk').style.zIndex = 300;

        map.createPane('jalan');
        map.getPane('jalan').style.zIndex = 400;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var sarana_prasarana = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "images/home_marker.png",
                        iconSize: [48, 48],
                        iconAnchor: [24, 48],
                        popupAnchor: [0, -48],
                        tooltipAnchor: [-16, -30],
                    }),
                });
            },
            onEachFeature: function (feature, layer) {
                var popup_content =
                    "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0] + "<br>" +
                    "<img src='images/" + feature.properties.image + "' alt='' width='200'>";

                layer.bindPopup(popup_content);
                layer.bindTooltip(feature.properties.TOPONIMI, {
                    direction: "left",
                    sticky: true,
                });
            },
        });

        $.getJSON("Geojson/toponimi.geojson", function (data) {
            sarana_prasarana.addData(data);
            map.addLayer(sarana_prasarana);
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'jalan',
            style: function (feature) {
                var namaUnsur = feature.properties.NAMA_UNSUR;

                // Jalan Provinsi (tebal 3, merah)
                if (namaUnsur === "Jalan Provinsi" || namaUnsur === "Jalan Propinsi") {
                    return {
                        pane: 'jalan',
                        color: "red",
                        weight: 3,
                        opacity: 1,
                    };
                }
                // Jalan Kabupaten (tebal 1.5, putus-putus panjang, merah)
                if (namaUnsur === "Jalan Kabupaten") {
                    return {
                        pane: 'jalan',
                        color: "red",
                        weight: 2,
                        opacity: 1,
                        dashArray: "10, 10",
                    };
                }
                // Jalan Lain (tebal 0.5, putus-putus pendek, merah)
                return {
                    pane: 'jalan',
                    color: "red",
                    weight: 1,
                    opacity: 1,
                    dashArray: "3, 5",
                };
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.bindPopup(popup_content);
                layer.bindTooltip(feature.properties.NAMA_UNSUR, {
                    direction: "auto",
                    sticky: true,
                });
            },
        });

        $.getJSON("Geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'jumlah_penduduk',
            style: function (feature) {
                if (feature.properties.jumlah_penduduk_kecamatan_Penduduk <= 12000) {
                    return {
                        pane: 'jumlah_penduduk',
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#FFFB54'
                    }
                }
                if (feature.properties.jumlah_penduduk_kecamatan_Penduduk > 12000 && feature.properties.jumlah_penduduk_kecamatan_Penduduk <= 24000) {
                    return {
                        pane: 'jumlah_penduduk',
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#FC9B32'
                    }
                }
                if (feature.properties.jumlah_penduduk_kecamatan_Penduduk > 24000) {
                    return {
                        pane: 'jumlah_penduduk',
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#F5470C'
                    }
                }
            },
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        var props = feature.properties;
                        var kecamatan = props.WADMKC || props.NAMOBJ || '-';
                        var penduduk = props.jumlah_penduduk_kecamatan_Penduduk ? props.jumlah_penduduk_kecamatan_Penduduk.toLocaleString('id-ID') : '-';
                        var kabupaten = props.WADMKK || 'Flores Timur';
                        var luas = props.luas_km2 ? props.luas_km2 + ' km²' : '-';

                        var content = '<table class="table table-striped mb-0">' +
                            '<tr><th style="width: 40%;">Kecamatan</th><td>' + kecamatan + '</td></tr>' +
                            '<tr><th>Kabupaten</th><td>' + kabupaten + '</td></tr>' +
                            '<tr><th>Jumlah Penduduk</th><td>' + penduduk + ' jiwa</td></tr>' +
                            (props.luas_km2 ? '<tr><th>Luas Wilayah</th><td>' + luas + '</td></tr>' : '') +
                            '</table>';

                        document.getElementById('pendudukModalLabel').innerHTML = 'Detail Kecamatan ' + kecamatan;
                        document.getElementById('pendudukModalBody').innerHTML = content;

                        var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('pendudukModal'));
                        modal.show();
                    },
                });

                layer.bindTooltip(String(feature.properties.jumlah_penduduk_kecamatan_Penduduk), {
                    direction: "auto",
                    sticky: true,
                });
            },
        });

        $.getJSON("Geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var legenda_jalan = "Jalan<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='3'/></svg> Jalan Propinsi<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='2' stroke-dasharray='7, 4'/></svg> Jalan Kabupaten<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='1' stroke-dasharray='4, 4'/></svg> Jalan Lain";

        var legenda_penduduk = "Jumlah Penduduk<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #ffffb2; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &le; 12.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #fd8d3c; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> 12.001 - 24.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #bd0026; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &gt; 24.000 jiwa";

        var overlayMaps = {
            "<img src='images/home_marker.png' width='18' style='vertical-align: middle; margin-right: 4px;'> Toponimi": sarana_prasarana,
            [legenda_jalan]: jalan,
            [legenda_penduduk]: jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            metric: true,
            imperial: false,
        }).addTo(map);

    </script>
</body>

</html>
